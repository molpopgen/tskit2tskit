[workspace]
resolver = "3"

members = [
    "tskit2tskit",
    "maketrees"
]

[workspace.package]
edition = "2021"
homepage = "https://github.com/molpopgen/tskit2tskit"
repository = "https://github.com/molpopgen/tskit2tskit"
rust-version = "1.88.0"
license = "MIT"

[workspace.dependencies]
# dependencies
tskit = { version = "0.16.4-alpha.0" }
pyo3 = { version = ">=0.28.3" }

[workspace.lints.rust]
# Added for rust 1.80.0
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(doc_cfg)'] }
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = { level = "deny" }
