[package]
name = "tskit2tskit"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.88.0"
description = "Data exchange between tskit (rust) and tskit (python)"
license = "MIT"
homepage = "https://github.com/molpopgen/tskit2tskit"
repository = "https://github.com/molpopgen/tskit2tskit"

[dependencies]
libc = "0.2.183"
pyo3 = ">=0.28.3"
tskit = { version = ">=0.15.0", features = ["bindings", "unsafe_init"] }

[dev-dependencies]
pyo3 = { version = ">=0.28.3", features = ["auto-initialize"] }
clap = { version = ">=4", features = ["derive"] }
rand = "0.8.3"

[[example]]
name = "haploid_wright_fisher"
